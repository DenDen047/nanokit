[helpers]

[default]
depends = []

[default.files]
nvim = { target = "$HOME/.config/nvim", type = "symbolic", recurse = false }
zshenv = "$HOME/.zshenv"
zshrc = "$HOME/.zshrc"
tigrc = "$HOME/.tigrc"
npmrc = "$HOME/.npmrc"
"pixi-global.toml" = "$HOME/.pixi/manifests/pixi-global.toml"
"sheldon.toml" = "$HOME/.config/sheldon/plugins.toml"
"tmux.conf" = "$HOME/.tmux.conf"
wezterm = { target = "$HOME/.config/wezterm", type = "symbolic", recurse = false }
"starship.toml" = "$HOME/.config/starship.toml"
"uv.toml" = "$HOME/.config/uv/uv.toml"
"yt-dlp/config" = "$HOME/.config/yt-dlp/config"
"gwq.toml" = "$HOME/.config/gwq/config.toml"
"claude/CLAUDE.md" = "$HOME/.claude/CLAUDE.md"
"claude/scripts/zotero-mcp-server.sh" = "$HOME/.claude/scripts/zotero-mcp-server.sh"
"claude/scripts/workspace-mcp-personal-server.sh" = "$HOME/.claude/scripts/workspace-mcp-personal-server.sh"
"claude/scripts/workspace-mcp-hdt-server.sh" = "$HOME/.claude/scripts/workspace-mcp-hdt-server.sh"
"claude/scripts/scrapling-mcp-server.sh" = "$HOME/.claude/scripts/scrapling-mcp-server.sh"
"claude/scripts/karpathy-reminder.sh" = "$HOME/.claude/scripts/karpathy-reminder.sh"
"claude/scripts/vision-reminder.sh" = "$HOME/.claude/scripts/vision-reminder.sh"
"claude/scripts/memory-extract.sh" = "$HOME/.claude/scripts/memory-extract.sh"
"claude/scripts/agent-config-sync-reconnect.sh" = "$HOME/.claude/scripts/agent-config-sync-reconnect.sh"
"claude/scripts/mmdc" = "$HOME/.pixi/bin/mmdc"
"tools/jarvislabs/jl" = "$HOME/.pixi/bin/jl"
# Agent Reach env が出す 3 コマンド。実体はどれも tools/agent-reach/run-in-env。
"tools/agent-reach/agent-reach" = "$HOME/.pixi/bin/agent-reach"
"tools/agent-reach/twitter" = "$HOME/.pixi/bin/twitter"
"tools/agent-reach/rdt" = "$HOME/.pixi/bin/rdt"
# OpenCLI だけは npm 専売なので同じ env には入らず、npx 固定のラッパを配る。
"tools/agent-reach/opencli" = "$HOME/.pixi/bin/opencli"
# Coast (作業ログ) の CLI ラッパ。実体は .app 同梱バイナリで pixi global に入らない。
"tools/coast/coast" = "$HOME/.pixi/bin/coast"
"claude/agents" = { target = "$HOME/.claude/agents", type = "symbolic", recurse = false }
"claude/output-styles" = { target = "$HOME/.claude/output-styles", type = "symbolic", recurse = false }
"claude/ccstatusline/settings.json" = "$HOME/.config/ccstatusline/settings.json"

[default.variables]

[settings]
default_target_type = "symbolic"
