[workspace]
name = "scrapling-mcp"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]
exclude-newer = "7d"

[dependencies]
python = ">=3.10,<3.14"

[pypi-dependencies]
scrapling = { version = "*", extras = ["ai"] }

[tasks]
mcp = "scrapling mcp"
# scrapling 0.5 からブラウザは patchright 経由で起動する。版が上がると要るブラウザの版も変わるので、
# nanokit upgrade が lock を上げたあとに post-update を走らせる。
install-browsers = "patchright install chromium"
post-update = { depends-on = ["install-browsers"] }
