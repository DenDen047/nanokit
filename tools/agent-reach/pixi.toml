[workspace]
name = "agent-reach"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]
exclude-newer = "7d"

[dependencies]
python = ">=3.10"
# RSS / Atom の読み取り。上流は 1.6 で RSS チャンネルを廃止したが、このホストでは使い続ける。
feedparser = "*"
# agent-reach が X と Reddit で起動する OpenCLI の daemon 用。run-in-env がこの node で OpenCLI を .opencli/ に入れる。
nodejs = ">=20"

# インターネット取得の単一の入口。agent-reach は PyPI にも conda-forge にも無く、pixi global は conda パッケージしか入れられない (prefix-dev/pixi#2261) ため、pixi-global.toml ではなくこのプロジェクト env に置き、run-in-env 経由で PATH に出す。X と Reddit の読み取りに使う OpenCLI は npm 専売なので、隣の opencli ラッパー (版固定の npx) が担う。agent-reach は PATH にある opencli をそのまま使う。
#
# 禁止: `agent-reach update` / `setup` / `add` / `uninstall` (自分で uv・pip・npm を叩いて ~/.agent-reach/tools/ に入れ直し、pixi-only を壊す) と `agent-reach skill link|unlink` (skill の配布を書き換える)。スキルは claude/skills/agent-reach/ を単一ソースとして vendor 済み。
[pypi-dependencies]
# https://github.com/Panniantong/Agent-Reach (MIT) — PyPI 未公開なので rev 固定。
# 更新は rev を上げて `pixi update` し、claude/skills/agent-reach/ も同じ rev から貼り直す。
agent-reach = { git = "https://github.com/Panniantong/agent-reach.git", rev = "c70ae6da5d39bc90e09ad2ae0575ccc89f31e284" }

[tasks]
doctor = "agent-reach doctor"
version = "python -c 'import agent_reach; print(agent_reach.__version__)'"
