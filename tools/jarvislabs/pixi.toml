[workspace]
name = "jarvislabs"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]

[dependencies]
python = ">=3.11"  # ledger.py が tomllib を使う (3.11 で標準ライブラリ入り)
# 費用台帳 (./ledger.py) の単体テスト用。CLI 本体の実行には不要。
pytest = ">=8"

[pypi-dependencies]
# Upstream: https://github.com/jarvislabsai/jarvislabs (MIT) — docs: https://docs.jarvislabs.ai/cli/
# CLI and SDK for the JarvisLabs.ai GPU cloud. The CLI entry point is `jl`.
# Not on conda-forge, and `pixi global` cannot install PyPI packages
# (prefix-dev/pixi#2261), hence this project env instead of a pixi-global entry.
# `jl` is still exposed on PATH via the ~/.pixi/bin/jl shim (see ./jl).
jarvislabs = ">=0.2.16"

[tasks]
version = "jl --version"
# 費用台帳のテスト。ネットワークにも実際の台帳ファイルにも触れない。
test = "pytest test_ledger.py -q"
